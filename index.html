<script>
const $=s=>document.querySelector(s),K='mis-gastos-portfolio-data',fmt=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);

const MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],DN=['L','M','X','J','V','S','D'];
const now=new Date(),mk=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
let S,ui={q:'',fc:'',tab:'home',mo:mk(now),yr:now.getFullYear(),day:null,touched:false,ed:null};
const KW=[['mercadona','Mercadona','Supermercado'],['consum','Consum','Supermercado'],['carrefour','Carrefour','Supermercado'],['lidl','Lidl','Supermercado'],['aldi','Aldi','Supermercado'],['uber','Uber','Transporte','Taxi/VTC'],['cabify','Cabify','Transporte','Taxi/VTC'],['renfe','Renfe','Viajes'],['metrovalencia','Metrovalencia','Transporte','Metro'],['emt','EMT','Transporte'],['repsol','Repsol','Transporte','Gasolina'],['cepsa','Cepsa','Transporte','Gasolina'],['galp','Galp','Transporte','Gasolina'],['netflix','Netflix','Suscripciones'],['spotify','Spotify','Suscripciones'],['disney','Disney+','Suscripciones'],['hbo','HBO','Suscripciones'],['mcdonald',"McDonald's",'Ocio','Restaurantes'],['burger king','Burger King','Ocio','Restaurantes'],['telepizza','Telepizza','Ocio','Restaurantes'],['glovo','Glovo','Ocio','Restaurantes'],['yelmo','Yelmo','Ocio','Cine'],['cine','Cine','Ocio','Cine'],['entrada','Entradas','Ocio','Fiesta'],['discoteca','Discoteca','Ocio','Fiesta'],['fever','Fever','Ocio','Fiesta'],['farmacia','Farmacia','Salud'],['gimnasio','Gimnasio','Salud'],['gym','Gimnasio','Salud'],['iberdrola','Iberdrola','Hogar','Suministros'],['alquiler','Alquiler','Hogar','Alquiler']];
const def=()=>({cards:['Tarjeta principal'],rules:[],tx:[],bud:{},cats:[{n:'Supermercado',c:'#22c55e',s:[]},{n:'Ocio',c:'#a855f7',s:['Fiesta','Cine','Restaurantes']},{n:'Transporte',c:'#3b82f6',s:['Gasolina','Metro','Taxi/VTC']},{n:'Viajes',c:'#14b8a6',s:[]},{n:'Suscripciones',c:'#ef4444',s:[]},{n:'Salud',c:'#ec4899',s:[]},{n:'Hogar',c:'#f59e0b',s:['Alquiler','Suministros']},{n:'Otros',c:'#64748b',s:[]}]});
// Portfolio demo: no credentials, sessions or remote API calls.
const uid=()=>crypto.randomUUID();
let BANK_BALANCES={},SES=null,ft,stx='DEMO · Datos ficticios · Solo en este navegador';
function sync(){return Promise.resolve()}
function flush(){return Promise.resolve(false)}
function logout(){resetDemo()}
function seedDemo(){
 S=def();S.cards=['Sabadell','Revolut'];migrateFunds();S.opening={Efectivo:75};
 const today=new Date(),year=today.getFullYear(),month=today.getMonth();
 const entries=[['i',1800,'Nómina de ejemplo','Sabadell','Ingresos'],['g',52.30,'Mercadona','Sabadell','Supermercado'],['g',9.99,'Spotify','Revolut','Suscripciones'],['g',24.50,'Cena de ejemplo','Revolut','Ocio'],['i',18,'Bizum recibido de ejemplo','Revolut','Bizum recibidos'],['g',12,'Bizum enviado de ejemplo','Sabadell','Bizums pagados'],['g',8.40,'Metro','Revolut','Transporte'],['g',16,'Farmacia','Sabadell','Salud'],['g',4.50,'Café de ejemplo','Efectivo','Ocio']];
 for(let offset=0;offset<3;offset++)entries.forEach(([t,a,m,k,c],i)=>S.tx.push({id:uid(),ts:new Date(year,month-offset,Math.min(today.getDate(),2+i*2),12).getTime(),t,a,m,k,c,s:'',nt:'Movimiento ficticio para la demo',r:m==='Spotify'}));
 S.tx.forEach(classifyMovement);
 BANK_BALANCES={Sabadell:{bank:'Sabadell',amount:1420.50,currency:'EUR',balance_type:'ITAV',fetched_at:today.toISOString()},Revolut:{bank:'Revolut',amount:325.80,currency:'EUR',balance_type:'ITAV',fetched_at:today.toISOString()}};
}
function load(){seedDemo();try{const cached=JSON.parse(sessionStorage.getItem(K)||'null');if(cached){S=cached;migrateFunds()}}catch{}}
function save(){sessionStorage.setItem(K,JSON.stringify(S))}
function resetDemo(){sessionStorage.removeItem(K);seedDemo();render()}
const cat=(n,t='g')=>[...S.cats,...(S.hiddenCats||[])].find(c=>c.n===n&&c.t===t)||{n,t,c:'#64748b',s:[]};
const categoriesFor=t=>S.cats.filter(c=>c.t===t);
const activeCategory=(n,t)=>categoriesFor(t).some(c=>c.n===n);
const strip=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const kw=low=>KW.find(r=>new RegExp('\\b'+r[0]).test(low));
function norm(raw){const low=strip(raw),h=kw(low);if(h)return h[1];const w=low.replace(/[^a-z\s]/g,' ').split(/\s+/).filter(x=>x.length>1&&!['sa','sl','vlc','valencia','es','spain','slu','sau','com','www','tpv'].includes(x)).slice(0,3);return w.length?w.map(x=>x[0].toUpperCase()+x.slice(1)).join(' '):raw.trim()}
function classify(raw,t='g'){const n=t==='g'?norm(raw):raw,low=strip(raw)+' '+strip(n),r=S.rules.find(r=>(r.t||'g')===t&&low.includes(r.k)&&activeCategory(r.c,t));if(r)return{c:r.c,s:r.s||''};const h=t==='g'?kw(strip(raw)):null;return h&&activeCategory(h[2],t)?{c:h[2],s:h[3]||''}:{c:t==='i'?'Ingresos':'Otros',s:''}}
const sum=(l,t)=>l.filter(x=>x.t==t&&!isInternal(x)).reduce((a,x)=>a+cents(x.a),0)/100,mtx=()=>S.tx.filter(x=>mk(x.ts)==ui.mo),tm=ts=>new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
function typedCategories(cats){const list=[];for(const c of Array.isArray(cats)?cats:[]){if(!c||typeof c.n!=='string'||!c.n.trim())continue;const t=c.t==='i'?'i':c.t==='g'?'g':['Ingresos','Bizum recibidos','Transferencias recibidas'].includes(c.n)?'i':'g';if(!list.some(x=>x.t===t&&strip(x.n)===strip(c.n)))list.push({...c,t,s:Array.isArray(c.s)?c.s:[]})}return list}
function movementCategories(cats,hidden=[]){const list=typedCategories(cats),archived=typedCategories(hidden);for(const [n,c,t] of [['Otros','#64748b','g'],['Ingresos','#16a34a','i'],['Bizums pagados','#8b5cf6','g'],['Bizum recibidos','#10b981','i'],['Transferencias recibidas','#0ea5e9','i']])if(!list.some(x=>x.n===n&&x.t===t)&&!archived.some(x=>x.n===n&&x.t===t))list.push({n,c,t,s:[]});return list}
function bizumCategory(raw,t){const n=t==='i'?'Bizum recibidos':'Bizums pagados';return /\bbizum(?:s)?\b/i.test(raw)&&activeCategory(n,t)?n:''}
function classifyMovement(x){if(isInternal(x))return;const b=bizumCategory((x.m||'')+' '+(x.nt||''),x.t);if(b){x.c=b;x.s=''}else if(x.c==='Sin clasificar'){const r=classify((x.m||'')+' '+(x.nt||''),x.t);x.c=r.c;x.s=r.s}}
function movementOptions(t,selected){const active=categoriesFor(t),historical=selected&&!active.some(c=>c.n===selected)?`<option selected value="${esc(selected)}">${esc(selected)} (del historial)</option>`:'';return historical+active.map(c=>`<option value="${esc(c.n)}"${c.n===selected?' selected':''}>${esc(c.n)}</option>`).join('')}
function incomeSummary(){const list=mtx().filter(x=>x.t==='i'&&!isInternal(x)).sort((a,b)=>b.ts-a.ts),biz=list.filter(x=>x.c==='Bizum recibidos');return `<details class="income-details"><summary>Ver ingresos y procedencia (${list.length})</summary><p class="mu">Bizum ${fmt(sum(biz,'i'))} · Otros ingresos ${fmt(sum(list.filter(x=>x.c!=='Bizum recibidos'),'i'))}</p><small>Pulsa un ingreso para editarlo o borrarlo.</small>${list.length?datedRows(list):'<p class="mu">No hay ingresos este mes.</p>'}</details>`}
function monthTotals(list=mtx()){const spent=sum(list,'g'),income=sum(list,'i');return {spent,income,net:(cents(income)-cents(spent))/100}}
function monthlySummary(){const {spent,income,net}=monthTotals();return `<section class="card monthly-summary" aria-label="Totales del mes"><div class="two"><div><small>Total gastado</small><h2 class="expense" data-metric="spent">${fmt(spent)}</h2></div><div><small>Total ingresado</small><h2 class="in" data-metric="income">${fmt(income)}</h2></div></div><div class="month-difference"><small>Diferencia del mes</small><h2 class="${net<0?'neg':net>0?'pos':''}" data-metric="net">${net>0?'+':''}${fmt(net)}</h2><small>Total ingresado − total gastado</small></div></section>`}
function expenseCategories(){const groups=new Map();for(const x of mtx().filter(x=>x.t==='g'&&!isInternal(x))){const name=x.c||'Otros';if(!groups.has(name))groups.set(name,[]);groups.get(name).push(x)}return [...groups].map(([name,list])=>({name,list,total:sum(list,'g')})).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name))}
function categorySpending(){const groups=expenseCategories();return groups.length?groups.map(({name,list,total})=>`<details class="category-group"><summary><span class="g"><b>${esc(name)}</b><small>${list.length} ${list.length===1?'gasto':'gastos'}</small></span><b>${fmt(total)}</b></summary><div class="category-movements">${datedRows(list)}</div></details>`).join(''):'<p class="mu">No hay gastos registrados este mes.</p>'}
function spendingChart(){const groups=expenseCategories(),total=sum(mtx(),'g'),palette=['#eeeeee','#c5c5c5','#a0a0a0','#7d7d7d','#5e5e5e','#464646','#343434','#242424'];if(!total)return '';let offset=0;const segments=groups.map((g,i)=>{const share=cents(g.total)/cents(total)*100,color=palette[i%palette.length],part={...g,share,color,offset};offset+=share;return part});return `<section class="card spending-chart" aria-label="Gráfico circular de gasto por categoría"><h3>Gasto por categoría</h3><div class="chart-layout"><svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Gasto del mes: ${esc(fmt(total))}. ${segments.map(g=>esc(g.name)+': '+g.share.toFixed(1)+' %').join('. ')}"><circle cx="60" cy="60" r="45" fill="none" stroke="var(--ln)" stroke-width="16"/>${segments.map(g=>`<circle cx="60" cy="60" r="45" fill="none" stroke="${g.color}" stroke-width="16" pathLength="100" stroke-dasharray="${g.share} ${100-g.share}" stroke-dashoffset="${-g.offset}" transform="rotate(-90 60 60)"><title>${esc(g.name)}: ${fmt(g.total)} (${g.share.toFixed(1)} %)</title></circle>`).join('')}</svg><ul class="chart-legend">${segments.map(g=>`<li><i style="background:${g.color}" aria-hidden="true"></i><span>${esc(g.name)}</span><small>${g.share.toLocaleString('es-ES',{maximumFractionDigits:1})} %</small></li>`).join('')}</ul></div></section>`}
function merchantRanking(){const groups=new Map();for(const x of mtx().filter(x=>x.t==='g'&&!isInternal(x)&&x.c!=='Bizums pagados'&&!/\bbizum(?:s)?\b/i.test((x.m||'')+' '+(x.nt||'')))){const name=norm(x.m||'Sin comercio'),key=strip(name);if(!groups.has(key))groups.set(key,{name,cents:0,count:0});const group=groups.get(key);group.cents+=cents(x.a);group.count++}return [...groups.values()].sort((a,b)=>b.cents-a.cents||a.name.localeCompare(b.name)).map(x=>({...x,total:x.cents/100}))}
function merchantList(list,start=1){return `<ol class="merchant-ranking" start="${start}">${list.map(x=>`<li><div class="g"><b>${esc(x.name)}</b><small>${x.count} ${x.count===1?'pago':'pagos'}</small></div><b>${fmt(x.total)}</b></li>`).join('')}</ol>`}
function merchantSummary(){const list=merchantRanking();return `<section class="card"><h3>Comercios con más gasto</h3><small>Pagos del mes · sin Bizum ni traspasos</small>${list.length?merchantList(list.slice(0,5))+(list.length>5?`<details><summary>Ver todos los comercios (${list.length})</summary>${merchantList(list.slice(5),6)}</details>`:''):'<p class="mu">No hay gastos registrados este mes.</p>'}</section>`}
function recs(){const g={};S.tx.filter(x=>x.t=='g'&&!isInternal(x)).forEach(x=>(g[x.m]=g[x.m]||[]).push(x));return Object.entries(g).map(([m,l])=>{l.sort((a,b)=>b.ts-a.ts);const a=l[0].a,ms=new Set(l.map(x=>mk(x.ts))).size,like=l.filter(x=>Math.abs(x.a-a)<=a*.15).length;return(l.some(x=>x.r)||(ms>=2&&like>=2))&&{m,a,c:l[0].c,ts:l[0].ts}}).filter(Boolean)}
const row=x=>`<div class="row" onclick="edit('${x.id}')"><i class="dot" style="background:${cat(x.c,x.t).c}"></i><div class="g"><b>${esc(x.m)}</b><small>${isInternal(x)?'Traspaso':x.t=='i'?esc(x.c||'Ingresos'):esc(x.c)+(x.s?' · '+esc(x.s):'')} · ${tm(x.ts)} · ${esc(x.k)}${x.r?' · 🔁':''}</small>${x.nt?`<small class="nt">📝 ${esc(x.nt)}</small>`:''}</div><b class="${x.t=='i'?'in':'expense'}">${x.t=='i'?'+':'−'}${fmt(x.a)}</b></div>`;
const mnav=()=>{const[y,m]=ui.mo.split('-');return`<div class="mn"><button onclick="mv(-1)">‹</button><b>${MN[m-1]} ${y}</b><button onclick="mv(1)">›</button></div>`};
function mv(d){const[y,m]=ui.mo.split('-').map(Number);ui.mo=mk(new Date(y,m-1+d,1).getTime());ui.day=null;render()}
function openMenu(){$('#drawer').showModal();$('#menu-toggle').setAttribute('aria-expanded','true')}
function closeMenu(){if($('#drawer').open)$('#drawer').close();$('#menu-toggle').setAttribute('aria-expanded','false')}
function go(t){closeMenu();ui.tab=t;ui.day=null;ui.fc='';ui.q='';if(t==='home')ui.mo=mk(Date.now());if(t==='past')ui.yr=new Date().getFullYear();render();scrollTo(0,0)}
function viewMonth(k){ui.mo=k;go('month')}
function previousMonths(){const current=mk(Date.now()),months=[];for(let m=12;m>=1;m--){const k=ui.yr+'-'+String(m).padStart(2,'0');if(k<current){const tx=S.tx.filter(x=>mk(x.ts)===k);months.push({k,m,...monthTotals(tx)})}}return `<div class="mn"><button onclick="ui.yr--;render()" aria-label="Año anterior">‹</button><b>${ui.yr}</b><button onclick="ui.yr++;render()" aria-label="Año siguiente" ${ui.yr>=new Date().getFullYear()?'disabled':''}>›</button></div><p class="mu">Elige un mes para ver gastos, ingresos, diferencia y categorías.</p>`+months.map(x=>`<button class="history-month" onclick="viewMonth('${x.k}')"><span><strong>${MN[x.m-1]}</strong><small>Gastado ${fmt(x.spent)} · Ingresado ${fmt(x.income)}</small></span><span class="${x.net<0?'neg':x.net>0?'pos':''}">${x.net>0?'+':''}${fmt(x.net)} ›</span></button>`).join('')+(months.length?'':'<p class="mu">Todavía no hay meses anteriores en este año.</p>')}
function accounts(){return fundSummary()+`<details><summary>Gestionar cuentas y efectivo</summary>${cardSettings()}</details>`}
function datedRows(list){const days=new Map();for(const x of [...list].sort((a,b)=>b.ts-a.ts)){const day=new Date(x.ts).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});if(!days.has(day))days.set(day,[]);days.get(day).push(x)}return [...days].map(([day,rows])=>`<h3 class="movement-day">${esc(day)}</h3>${rows.map(row).join('')}`).join('')}
function lst(){const q=strip(ui.q||''),list=mtx().filter(x=>(!ui.fc||x.c===ui.fc)&&(!q||strip(x.m+' '+(x.nt||'')).includes(q)));return datedRows(list)||(S.tx.length?'<p class="mu">No hay movimientos con este filtro.</p>':'')}
function home(){return (ui.tab==='month'?mnav():fundSummary())+monthlySummary()+incomeSummary()+spendingChart()+merchantSummary()+`<h3 class="section-heading">Gastos por categoría</h3><p class="mu">Despliega una categoría para ver sus gastos de este mes.</p>`+categorySpending()+(S.tx.length?'':`<div class="card"><p>Aún no hay movimientos. Sabadell y Revolut se actualizan automáticamente. Los ingresos y gastos aparecen cuando el banco los contabiliza. Puedes registrar el efectivo manualmente.</p></div>`)+`<h3 class="section-heading">Movimientos del mes</h3>`+(S.tx.length?`<input type="search" style="margin-top:10px" placeholder="Buscar comercio o nota" value="${esc(ui.q)}" oninput="ui.q=this.value;$('#lst').innerHTML=lst()">`:'')+`<div id="lst">${lst()}</div>`}
function cal(){const[y,m]=ui.mo.split('-').map(Number),all=mtx(),dim=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7,by={};
all.filter(x=>x.t=='g'&&!isInternal(x)).forEach(x=>{const d=new Date(x.ts).getDate();by[d]=(by[d]||0)+x.a});Object.keys(by).forEach(d=>by[d]=money(by[d]));const ranked=Object.entries(by).sort((a,b)=>b[1]-a[1]||Number(a[0])-Number(b[0])),mx=Math.max(1,...Object.values(by)),cur=mk(now),today=cur==ui.mo?now.getDate():cur>ui.mo?dim:0;let free=0,c=DN.map(d=>`<b class="dn">${d}</b>`).join('')+'<i></i>'.repeat(off);
for(let d=1;d<=dim;d++){const v=by[d]||0;if(!v&&d<=today)free++;c+=`<button aria-label="Día ${d}, gasto ${fmt(v)}" aria-pressed="${ui.day==d}" class="cd${ui.day==d?' sel':''}" style="${v?`background:rgb(255 255 255 / ${.04+v/mx*.18})`:''}" onclick="ui.day=${d};render()"><span>${d}</span><small>${v?v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}</small></button>`}
const dl=ui.day?all.filter(x=>new Date(x.ts).getDate()==ui.day).sort((a,b)=>a.ts-b.ts):[];
return mnav()+`<div class="card"><div class="calendar-kpis"><div><small>Gastado este mes</small><h2 class="expense">${fmt(sum(all,'g'))}</h2></div><div><small>Días sin gasto</small><h2>${free}</h2></div></div>${ranked.length?`<h3 class="section-heading">Días con más gasto</h3><div class="peak-days">${ranked.slice(0,3).map(([d,v])=>`<button onclick="ui.day=${d};render()">Día ${d} · ${fmt(v)}</button>`).join('')}</div>`:''}<p class="mu">Las casillas más claras indican mayor gasto. Importes en euros; pulsa un día para ver sus movimientos.</p></div><div class="cg">${c}</div>`+(ui.day?`<h3>Día ${ui.day}</h3><button class="add" onclick="openForm(null,${cur==ui.mo&&ui.day==now.getDate()?'Date.now()':new Date(y,m-1,ui.day,12).getTime()})">+ Añadir gasto este día</button>`+(dl.map(row).join('')||'<p class="mu">Sin movimientos.</p>'):'')}
function recv(){const r=recs().sort((a,b)=>b.a-a.a),t=r.reduce((a,x)=>a+x.a,0);return`<div class="card"><small>Comprometido cada mes</small><h2>${fmt(t)}</h2></div>`+(r.length?r.map(x=>`<div class="row" style="cursor:default"><i class="dot" style="background:${cat(x.c,x.t).c}"></i><div class="g"><b>${esc(x.m)}</b><small>${esc(x.c)} · último: ${new Date(x.ts).toLocaleDateString('es-ES')}</small></div><b>${fmt(x.a)}</b></div>`).join(''):'<p class="mu">Un comercio se marca como recurrente cuando se repite en meses distintos con un importe parecido. También puedes marcar un gasto como recurrente al editarlo.</p>')}
function hist(){const months=[],cs={};for(let m=1;m<=12;m++){const k=ui.yr+'-'+String(m).padStart(2,'0'),list=S.tx.filter(x=>mk(x.ts)===k);months.push({m,k,...monthTotals(list)});list.filter(x=>x.t==='g'&&!isInternal(x)).forEach(x=>cs[x.c]=(cs[x.c]||0)+cents(x.a))}const yearly=monthTotals(S.tx.filter(x=>new Date(x.ts).getFullYear()===ui.yr));return `<div class="mn"><button onclick="ui.yr--;render()">‹</button><b>${ui.yr}</b><button onclick="ui.yr++;render()">›</button></div><div class="card"><div class="two"><div><small>Total gastado</small><h2 class="expense">${fmt(yearly.spent)}</h2></div><div><small>Total ingresado</small><h2 class="in">${fmt(yearly.income)}</h2></div></div><div class="month-difference"><small>Diferencia de ${ui.yr}</small><h2 class="${yearly.net<0?'neg':yearly.net>0?'pos':''}">${yearly.net>0?'+':''}${fmt(yearly.net)}</h2></div></div>`+months.map(x=>`<button class="history-month" onclick="viewMonth('${x.k}')"><span><strong>${MN[x.m-1]}</strong><small>Gastado ${fmt(x.spent)} · Ingresado ${fmt(x.income)}</small></span><span class="${x.net<0?'neg':x.net>0?'pos':''}">${x.net>0?'+':''}${fmt(x.net)} ›</span></button>`).join('')+'<h3>Gastos por categoría</h3>'+Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="row" style="cursor:default"><div class="g"><b>${esc(n)}</b></div><b>${fmt(v/100)}</b></div>`).join('')}
const opts=(t='g')=>categoriesFor(t).map(c=>`<option value="${esc(c.n)}">${esc(c.n)}</option>`).join('');
function categoryPanel(t){const title=t==='i'?'Categorías de ingresos':'Categorías de gastos';return `<section class="category-settings" aria-label="${title}"><h3>${title}</h3>${categoriesFor(t).map(c=>`<div class="row" style="cursor:default"><div class="g"><b>${esc(c.n)}</b><small>${c.s.map(esc).join(', ')||'Sin subcategorías'}</small></div>${c.n===(c.t==='i'?'Ingresos':'Otros')?'':`<button onclick="delCat(${S.cats.indexOf(c)})" aria-label="Eliminar categoría ${esc(c.n)} de ${t==='i'?'ingresos':'gastos'}">Eliminar</button>`}</div>`).join('')}<div class="frm"><input id="nc-${t}" placeholder="Nueva categoría de ${t==='i'?'ingresos':'gastos'}" aria-label="Nueva categoría de ${t==='i'?'ingresos':'gastos'}"><button onclick="addCat('${t}')">Añadir categoría</button></div><details><summary>Añadir subcategoría</summary><div class="frm"><select id="sc-${t}" aria-label="Categoría de ${t==='i'?'ingresos':'gastos'}">${opts(t)}</select><input id="sn-${t}" placeholder="Nueva subcategoría"><button onclick="addSub('${t}')">Añadir subcategoría</button></div></details></section>`}
function archivedCategories(){return `<section class="archived-categories"><h3>Categorías eliminadas</h3><p class="mu">Se conservan sus movimientos y subcategorías.</p>${S.hiddenCats.length?S.hiddenCats.map((c,i)=>`<div class="row" style="cursor:default"><div class="g"><b>${esc(c.n)}</b><small>${c.t==='i'?'Ingresos':'Gastos'}</small></div><button onclick="restoreCategory(${i})" aria-label="Restaurar categoría ${esc(c.n)} de ${c.t==='i'?'ingresos':'gastos'}">Restaurar</button></div>`).join(''):'<p class="mu">No hay categorías eliminadas.</p>'}</section>`}
function sett(){return `<div class="card"><h3>Demo de portfolio</h3><p>Todos los movimientos y saldos son ficticios. Los cambios duran mientras mantengas esta sesión del navegador. Esta demo no conecta con bancos ni con Supabase.</p><button onclick="resetDemo()">Restablecer demo</button></div><h3>Categorías</h3>${categoryPanel('g')}${categoryPanel('i')}${archivedCategories()}<details><summary>Cuentas y efectivo</summary>${cardSettings()}</details>`}
function addCat(t='g'){if(!['g','i'].includes(t))return;const n=$('#nc-'+t).value.trim();if(!n||n===INTERNAL)return;const archived=S.hiddenCats.findIndex(c=>c.t===t&&strip(c.n)===strip(n));if(archived>=0)return restoreCategory(archived);if(categoriesFor(t).some(c=>strip(c.n)===strip(n)))return toast('Esa categoría ya existe.');S.cats.push({n,t,c:t==='i'?'#16a34a':'#64748b',s:[]});save();render()}
function addSub(t='g'){const n=$('#sn-'+t).value.trim(),c=categoriesFor(t).find(c=>c.n===$('#sc-'+t).value);if(n&&c&&!c.s.includes(n)){c.s.push(n);save();render()}}
function addRule(){const k=strip($('#rk').value.trim()),t=$('#rt').value,c=$('#rc').value;if(k&&activeCategory(c,t)){S.rules.unshift({k,t,c,s:''});save();render()}}
function imp(){try{const d=JSON.parse($('#js').value);if(d&&d.tx&&d.cats){const k={secret:S.secret};S=Object.assign(d,k);migrateFunds();S.tx.forEach(x=>{if(!/^[0-9a-f-]{36}$/.test(x.id))x.id=uid()});save();render()}}catch(e){$('#js').value=''; $('#js').placeholder='Copia no válida'}}
function openForm(x,t0){const e=!!(x&&x.id);x=x||{id:'',ts:t0||Date.now(),t:'g',a:'',m:'',c:'Otros',s:'',k:S.cards[0]||CASH,nt:'',r:false};ui.touched=e;ui.ed={...x};const dt=new Date(x.ts-new Date(x.ts).getTimezoneOffset()*6e4).toISOString().slice(0,16);
$('#m').innerHTML=`<div class="sheet"><h3 style="margin:0">${e?'Editar':'Nuevo'} movimiento</h3><div class="seg"><button id="tg" class="${x.t=='g'?'on':''}" onclick="sT('g')">Gasto</button><button id="ti" class="${x.t=='i'?'on':''}" onclick="sT('i')">Ingreso</button></div>${e?'':rc()}
<input id="fa" type="number" step="0.01" inputmode="decimal" placeholder="Importe (€)" value="${x.a}"><input id="fm" list="ml" placeholder="Comercio o concepto" value="${esc(x.m)}" oninput="auto()"><datalist id="ml">${[...new Set(S.tx.map(y=>y.m))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><input id="fd" type="datetime-local" value="${dt}">
<select id="fk">${accountOptions(x.k)}</select>
<div id="gx" style="display:grid;gap:8px"><select id="fc" onchange="ui.touched=true;subs()">${movementOptions(x.t,x.c)}</select><select id="fs"></select>
<label class="ck"><input id="fr" type="checkbox"${x.r?' checked':''}> Gasto recurrente</label><label class="ck"><input id="fx" type="checkbox" checked> Recordar esta categoría para este comercio</label></div>
<input id="fn" placeholder="Nota (ej. cumpleaños Juan)" value="${esc(x.nt)}" oninput="auto()"><div class="frm"><button class="pri" onclick="saveTx()">Guardar</button>${e?'<button onclick="dupTx()">Duplicar</button><button onclick="delTx()">Borrar</button>':''}<button onclick="closeM()">Cancelar</button></div></div>`;subs(x.s);if(!e)$('#fa').focus()}
const closeM=()=>{$('#m').innerHTML=''};
function sT(t){ui.ed.t=t;$('#tg').className=t=='g'?'on':'';$('#ti').className=t=='i'?'on':'';$('#gx').style.display='grid';$('#fc').innerHTML=movementOptions(t,t==='i'?'Ingresos':'Otros');subs();auto()}
function subs(sel){const c=cat($('#fc').value,ui.ed.t);$('#fs').innerHTML='<option value="">Sin subcategoría</option>'+c.s.map(s=>`<option${s==sel?' selected':''}>${esc(s)}</option>`).join('')}
function auto(){if(ui.touched)return;const raw=$('#fm').value+' '+$('#fn').value,b=bizumCategory(raw,ui.ed.t),r=b?{c:b,s:''}:classify(raw,ui.ed.t);$('#fc').value=r.c;subs(r.s)}
function saveTx(){const x=ui.ed,a=Number($('#fa').value),raw=$('#fm').value.trim();if(!Number.isFinite(a)||cents(a)<=0||!raw){const q=$(!Number.isFinite(a)||cents(a)<=0?'#fa':'#fm');q.classList.add('bad');q.focus();return}
const chosen=$('#fk').value,date=new Date($('#fd').value).getTime();if(!chosen||!Number.isFinite(date))return alert('Selecciona una tarjeta o efectivo y una fecha válida.');
const t=x.t,ts=date,n=t=='i'?raw:norm(raw),c=bizumCategory(raw+' '+$('#fn').value,t)||$('#fc').value,s=$('#fs').value;
const o={id:x.id||uid(),ts,t,a:money(a),m:n,c,s,k:$('#fk').value,nt:$('#fn').value.trim(),r:t=='g'&&$('#fr').checked};
if(t=='g'&&ui.touched&&$('#fx').checked){const d=classify(raw);if(d.c!=c||d.s!=s){const k=strip(n);S.rules=S.rules.filter(r=>r.k!=k);S.rules.unshift({k,c,s});S.tx.forEach(y=>{if(y.t=='g'&&y.m==n){y.c=c;y.s=s}})}}
const i=S.tx.findIndex(y=>y.id==o.id);i<0?S.tx.push(o):S.tx[i]=o;ui.mo=mk(ts);save();closeM();render();toast('Guardado ✓')}
function delTx(){const x=ui.ed;S.tx=S.tx.filter(y=>y.id!=x.id);save();closeM();render();toast('Movimiento borrado',()=>{S.tx.push(x);save();render()})}
function dupTx(){const x={...ui.ed,id:'',ts:Date.now()};closeM();openForm(x)}
let tt;function toast(m,u){clearTimeout(tt);$('#t').innerHTML=`<div class="toast"><span>${m}</span>${u?'<button id="ud">Deshacer</button>':''}</div>`;if(u)$('#ud').onclick=()=>{u();$('#t').innerHTML=''};tt=setTimeout(()=>{$('#t').innerHTML=''},5000)}
function rc(){const c={};S.tx.filter(x=>x.t=='g'&&!isInternal(x)).forEach(x=>c[x.m]=(c[x.m]||0)+1);const t=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6);return t.length?`<div class="chips">${t.map(([n])=>`<button class="chip" onclick="pick('${encodeURIComponent(n)}')">${esc(n)}</button>`).join('')}</div>`:''}
function pick(n){$('#fm').value=decodeURIComponent(n);ui.touched=false;auto();$('#fa').focus()}
function delCat(i){const c=S.cats[i];if(!c||c.n===(c.t==='i'?'Ingresos':'Otros'))return;S.cats.splice(i,1);if(!S.hiddenCats.some(x=>x.n===c.n&&x.t===c.t))S.hiddenCats.push(c);save();render();toast('Categoría eliminada. Puedes restaurarla en Ajustes.',()=>{const i=S.hiddenCats.findIndex(x=>x.n===c.n&&x.t===c.t);if(i>=0)restoreCategory(i)})}
function restoreCategory(i){const c=S.hiddenCats[i];if(!c)return;S.hiddenCats.splice(i,1);if(!S.cats.some(x=>x.n===c.n&&x.t===c.t))S.cats.push(c);save();render();toast('Categoría restaurada ✓')}
let wa=false;function wipe(b){if(!wa){wa=true;b.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{wa=false;b.textContent='Borrar todo'},4000);return}wa=false;const k={secret:S.secret};S=Object.assign(def(),k);migrateFunds();save();render()}
const edit=id=>{const x=S.tx.find(x=>x.id==id);if(isInternal(x))openTransfer(x.s);else openForm(x)};
function demo(){S.cards=['Tarjeta principal','Revolut'];const R=[['MERCADONA 0234 VLC',18,55],['CONSUM VALENCIA SA',8,30],['UBER *TRIP HELP.UBER.COM',6,18],['REPSOL EST 221',25,55],['ENTRADA FIESTA ETSIT',10,20],['MCDONALDS 0451',6,14]];
for(let mo=3;mo>=0;mo--){const d0=new Date(now.getFullYear(),now.getMonth()-mo,1),y=d0.getFullYear(),mm=d0.getMonth(),dim=mo?28:now.getDate();S.bud[mk(d0.getTime())]=600;
const add=(d,h,mi,raw,a,t)=>{const i=t=='i',cl=i?{c:'Ingresos',s:''}:classify(raw);S.tx.push({id:uid(),ts:new Date(y,mm,d,h,mi).getTime(),t:t||'g',a,m:i?raw:norm(raw),c:cl.c,s:cl.s,k:S.cards[d%5?0:1],nt:'',r:false})};
for(let d=1;d<=dim;d++){const r=(d*37+mo*11)%9;if(r<6){const p=R[r];add(d,9+d*5%13,d*17%60,p[0],p[1]+(d*13+mo)%(p[2]-p[1]+1)+(d*7%100)/100)}}
if(dim>=1){add(1,8,0,'Ingreso mensual',650,'i');add(1,19,30,'GIMNASIO FIT',29.9)}if(dim>=5)add(5,10,0,'NETFLIX.COM',12.99);if(dim>=8)add(8,10,0,'SPOTIFY AB',10.99);if(dim>=10)add(10,14,5,'Bizum recibido',25,'i')}
save();ui.tab='home';render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SES)sync()});
function render(){const titles={home:'Mensual',month:'Mes anterior',past:'Meses anteriores',cal:'Calendario de gasto',accounts:'Cuentas y efectivo',rec:'Gastos recurrentes',hist:'Resumen anual',set:'Ajustes'},[year,month]=ui.mo.split('-'),monthly=ui.tab==='home'||ui.tab==='month';$('#section-label').textContent=titles[ui.tab];$('#v').innerHTML=`<div id="stt" class="sync-status">${esc(stx)}</div><div class="page-intro"><div class="eyebrow">${monthly?'Resumen mensual':'Mis Gastos'}</div><h1>${monthly?MN[Number(month)-1]+' '+year:titles[ui.tab]}</h1></div>`+({home,month:home,past:previousMonths,cal,accounts,rec:recv,hist,set:sett})[ui.tab]();document.querySelectorAll('.drawer-nav button').forEach(b=>{const active=b.dataset.t===(ui.tab==='month'?'past':ui.tab);b.classList.toggle('on',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').open)closeMenu()});

// Cuentas conectadas: saldo del banco. Efectivo y otras cuentas: historial y base manual.
const CASH='Efectivo', INTERNAL='Traspaso interno';
const cents=n=>Math.round((Number(n)+Number.EPSILON)*100);
const money=n=>cents(n)/100;
function migrateFunds(){
  S.hiddenCats=typedCategories(S.hiddenCats);S.cats=movementCategories(S.cats,S.hiddenCats);S.categoryVersion=2;delete S.pin;delete S.bio;
  S.cards=Array.isArray(S.cards)?[...new Set(S.cards.filter(c=>typeof c==='string'&&c&&c!==CASH))]:[];
  S.opening=S.opening||{};S.links=S.links||{};S.hiddenCards=S.hiddenCards||[];S.cashBud=S.cashBud||{};
}
const fundKey=k=>S.links[k]||k||'Sin asignar';
const isInternal=x=>x.c===INTERNAL;
function netBalance(k){return S.tx.filter(x=>fundKey(x.k)===k).reduce((n,x)=>n+(x.t==='i'?1:-1)*cents(x.a),0)/100}
function banksForFund(k){const low=String(k).trim().toLowerCase().replace(/\s+/g,' '),aliases={sabadell:'Sabadell','mastercard bscard':'Sabadell',revolut:'Revolut','revolut visa':'Revolut'};return ['Sabadell','Revolut'].filter(b=>fundKey(b)===k||aliases[low]===b)}
function bankSnapshot(k){const banks=banksForFund(k);return banks.length===1?BANK_BALANCES[banks[0]]||null:null}
function balance(k){if(banksForFund(k).length){const b=bankSnapshot(k);return b?b.amount:null}return money((S.opening[k]||0)+netBalance(k))}
const balanceText=k=>balance(k)===null?'—':fmt(balance(k));
function balanceNote(k){if(banksForFund(k).length){const b=bankSnapshot(k);if(!b)return 'Pendiente de saldo bancario';const date=new Date(b.fetched_at).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});return (['ITBD','CLBD'].includes(b.balance_type)?'Saldo contabilizado':'Saldo del banco')+' · '+date}return S.opening[k]===undefined?'Saldo inicial pendiente':k===CASH?'Registro manual':'Saldo calculado'}
function fundNames(){const seen=new Set();return [...new Set([...S.cards,CASH].map(fundKey))].filter(k=>{const banks=banksForFund(k),id=banks.length===1?'bank:'+banks[0]:'fund:'+k;if(seen.has(id))return false;seen.add(id);return true})}
const payNames=()=>[...S.cards,CASH];
function accountOptions(selected){return [...new Set([...payNames(),...(selected?[selected]:[])])].map(k=>`<option value="${esc(k)}"${k===selected?' selected':''}>${esc(k)}${S.hiddenCards.includes(k)?' (eliminada)':''}</option>`).join('')}
function globalBalance(){const amounts=[balance('Sabadell'),balance('Revolut'),balance(CASH)];return amounts.includes(null)||S.opening[CASH]===undefined?null:amounts.reduce((n,v)=>n+cents(v),0)/100}
function fundSummary(){const total=globalBalance();return `<section class="balances-overview" aria-label="Saldos actuales"><div class="card balance-global"><small>Saldo global</small><h2 class="${total!==null&&total<0?'neg':'pos'}" data-balance="global">${total===null?'—':fmt(total)}</h2><small>Sabadell + Revolut + efectivo</small><details class="cash-balance"><summary>Efectivo incluido: ${S.opening[CASH]===undefined?'sin configurar':balanceText(CASH)}</summary><small>El efectivo se actualiza con tus registros.</small><button onclick="setBalance(${payNames().indexOf(CASH)})">Ajustar efectivo</button></details></div><div class="bank-balances">${['Sabadell','Revolut'].map(k=>`<div class="card"><small>${k}</small><h2 class="${balance(k)<0?'neg':'pos'}" data-balance="${k}">${balanceText(k)}</h2><small>${esc(balanceNote(k))}</small></div>`).join('')}</div></section>`}
function cardSettings(){return `<h3>Tarjetas, cuentas y efectivo</h3><p class="mu">Sabadell y Revolut muestran el último saldo recibido del banco. Editar o borrar movimientos no cambia ese saldo. El efectivo y las cuentas sin conexión se calculan con tus registros. Las tarjetas eliminadas pueden restaurarse desde este apartado.</p>`+payNames().map((k,i)=>`<div class="card"><b>${esc(k)}</b>${fundKey(k)!==k?`<small> · Cuenta compartida: ${esc(fundKey(k))}</small>`:''}<h2>${balanceText(fundKey(k))}</h2><small>${esc(balanceNote(fundKey(k)))}</small><div class="frm">${banksForFund(fundKey(k)).length?'':`<button onclick="setBalance(${i})">Establecer saldo actual</button>`}<button onclick="newForCard(${i},'i')">+ Ingreso</button><button onclick="newForCard(${i},'g')">− Gasto</button>${k===CASH?'':`<button onclick="removeCard(${i})">Borrar tarjeta</button>`}</div></div>`).join('')+(S.hiddenCards.length?`<h3>Tarjetas eliminadas (historial conservado)</h3>`+S.hiddenCards.map((k,i)=>`<div class="row"><div class="g"><b>${esc(k)}</b><small>${balanceText(fundKey(k))} · Fuera del global, salvo cuenta compartida con una tarjeta activa.</small></div><button onclick="restoreCard(${i})">Restaurar</button></div>`).join(''):'')}
function setBalance(i){const k=fundKey(payNames()[i]);if(banksForFund(k).length)return toast('El saldo se actualiza desde el banco.');ui.balanceKey=k;$('#m').innerHTML=`<div class="sheet"><h3>Saldo actual de ${esc(k)}</h3><small>Indica cuánto tienes ahora. Este ajuste no cuenta como ingreso ni gasto.</small><label>Saldo actual (€)<input id="currentbalance" type="number" step="0.01" inputmode="decimal" value="${balance(k)}"></label><div class="frm"><button class="pri" onclick="saveBalance()">Guardar saldo</button><button onclick="closeM()">Cancelar</button></div></div>`}
function saveBalance(){const raw=$('#currentbalance').value,v=Number(raw),k=ui.balanceKey;if(banksForFund(k).length)return;if(raw.trim()===''||!Number.isFinite(v))return alert('Introduce un importe válido.');S.opening[k]=money(v-netBalance(k));save();closeM();render()}

function removeCard(i){const k=payNames()[i];if(k===CASH)return;ui.removingCard=k;$('#m').innerHTML=`<div class="sheet"><h3>Borrar ${esc(k)}</h3><p>Dejará de aparecer al añadir pagos. Su historial y saldo se conservarán y podrás restaurarla. Su cuenta solo seguirá contando en el saldo global si otra tarjeta activa comparte ese saldo.</p><small>Desactiva también su automatización en Atajos para que no siga enviando pagos.</small><div class="frm"><button class="pri" onclick="confirmRemoveCard()">Borrar tarjeta</button><button onclick="closeM()">Cancelar</button></div></div>`}
function confirmRemoveCard(){const k=ui.removingCard;S.cards=S.cards.filter(c=>c!==k);if(!S.hiddenCards.includes(k))S.hiddenCards.push(k);save();closeM();render()}

function restoreCard(i){const k=S.hiddenCards.splice(i,1)[0];if(k&&!S.cards.includes(k))S.cards.push(k);save();render()}
function newForCard(i,t){openForm({id:'',ts:Date.now(),t,a:'',m:'',c:t==='i'?'Ingresos':'Otros',s:'',k:payNames()[i],nt:'',r:false})}
function openTransfer(id){const pair=id?S.tx.filter(x=>isInternal(x)&&x.s===id):[],out=pair.find(x=>x.t==='g'),inc=pair.find(x=>x.t==='i');ui.transfer=id||'';const dt=new Date((out?.ts||Date.now())-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('#m').innerHTML=`<div class="sheet"><h3>Traspaso entre mis saldos</h3><small>Mueve dinero entre cuentas o retira efectivo. No cuenta como gasto ni ingreso. El saldo bancario se actualizará cuando lo comunique el banco.</small><label>Desde<select id="trfrom">${accountOptions(out?.k||payNames()[0])}</select></label><label>Hasta<select id="trto">${accountOptions(inc?.k||CASH)}</select></label><label>Importe (€)<input id="tra" type="number" min="0.01" step="0.01" value="${out?.a||''}" inputmode="decimal"></label><label>Fecha<input id="trdate" type="datetime-local" value="${dt}"></label><div class="frm"><button class="pri" onclick="saveTransfer()">Guardar</button>${id?'<button onclick="deleteTransfer()">Borrar traspaso</button>':''}<button onclick="closeM()">Cancelar</button></div></div>`}
function saveTransfer(){const from=$('#trfrom').value,to=$('#trto').value,a=Number($('#tra').value),ts=new Date($('#trdate').value).getTime();if(fundKey(from)===fundKey(to))return alert('Selecciona dos saldos diferentes.');if(!Number.isFinite(a)||cents(a)<=0||!Number.isFinite(ts))return alert('Introduce un importe positivo y una fecha válida.');const id=ui.transfer||uid(),old=S.tx.filter(x=>isInternal(x)&&x.s===id);S.tx=S.tx.filter(x=>!isInternal(x)||x.s!==id);for(const [t,k] of [['g',from],['i',to]])S.tx.push({id:old.find(x=>x.t===t)?.id||uid(),ts,t,a:money(a),m:'Traspaso: '+from+' → '+to,c:INTERNAL,s:id,k,nt:'',r:false});save();closeM();render();toast('Traspaso guardado ✓')}
function deleteTransfer(){const old=S.tx.filter(x=>isInternal(x)&&x.s===ui.transfer);S.tx=S.tx.filter(x=>!isInternal(x)||x.s!==ui.transfer);save();closeM();render();toast('Traspaso borrado',()=>{S.tx.push(...old);save();render()})}

$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer')){const r=$('#drawer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeMenu()}});$('#drawer').addEventListener('close',()=>{$('#menu-toggle').setAttribute('aria-expanded','false')});
load();render();
</script></body></html>
